<!DOCTYPE html>
<html>
<head>
  <title>ZIP Processor</title>
</head>

<body style="margin:0;font-family:Segoe UI;background:#1f3c72;color:white;text-align:center;">

<h2 style="margin-top:100px;">🚀 ZIP Processor</h2>

<input type="file" id="files" multiple><br><br>

<button onclick="upload()">Upload</button>
<button onclick="download()">Download</button>

<div style="position:fixed;bottom:10px;right:10px;color:#ccc;">
  @Innovatiview India Ltd.
</div>

<script>
let selectedFiles = [];

document.getElementById("files").addEventListener("change", function(e){
  selectedFiles = Array.from(e.target.files);
});

function upload() {
  if (selectedFiles.length === 0) {
    alert("Select files first");
    return;
  }

  let formData = new FormData();
  selectedFiles.forEach(f => formData.append("files", f));

  fetch("/upload", {
    method: "POST",
    body: formData
  });

  alert("Processing...");
}

function download() {
  window.open("/download");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>ZIP Processor</title>

  <style>
    body {
      margin:0;
      font-family:'Segoe UI';
      background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      color:white;
    }

    /* HEADER */
    .header {
      width:100%;
      padding:15px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      position:fixed;
      top:0;
    }

    .brand {
      font-size:12px;
      color:#ccc;
    }

    /* LOGIN */
    .login-overlay {
      position:fixed;
      width:100%;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      background: rgba(0,0,0,0.6);
    }

    .login-box {
      width:320px;
      padding:30px;
      border-radius:16px;
      background: #1e293b; /* DARK CARD */
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      text-align:center;
    }

    .login-box h2 {
      margin-bottom:20px;
      color:#fff;
    }

    .input-group {
      position:relative;
    }

    .login-box input {
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#334155;
      color:white;
      outline:none;
    }

    .eye {
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      cursor:pointer;
      color:#ccc;
    }

    .login-box button {
      margin-top:15px;
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background: linear-gradient(135deg,#00c6ff,#0072ff);
      color:white;
      cursor:pointer;
      font-weight:bold;
    }

    /* MAIN */
    .container {
      width:420px;
      margin:auto;
      margin-top:120px;
      padding:25px;
      border-radius:20px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      text-align:center;
      display:none;
    }

    #dropArea {
      border:2px dashed rgba(255,255,255,0.4);
      padding:25px;
      border-radius:12px;
      cursor:pointer;
    }

    button {
      margin-top:10px;
      padding:12px;
      width:100%;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
    }

    .upload { background: linear-gradient(135deg,#00c6ff,#0072ff); }
    .download { background: linear-gradient(135deg,#f7971e,#ffd200); }

    .bar {
      width:100%;
      background:rgba(255,255,255,0.2);
      border-radius:10px;
      margin-top:10px;
    }

    .progress {
      height:10px;
      width:0%;
      background: linear-gradient(90deg,#00ffcc,#00c6ff);
    }

    .footer {
      position:fixed;
      bottom:10px;
      right:15px;
      font-size:12px;
      color:#aaa;
    }
  </style>
</head>

<body>

<div class="header">
  <h3>⚡ Compile ZIP Processor</h3>
  <div class="brand">@Innovatiview

<!DOCTYPE html>
<html>
<head>
  <title>ZIP Processor</title>

  <style>
    body {
      margin:0;
      font-family:'Segoe UI';
      background: linear-gradient(135deg,#1f3c72,#2a5298);
      color:white;
    }

    .login-overlay {
      position:fixed;
      width:100%;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      backdrop-filter: blur(10px);
    }

    .login-box {
      width:320px;
      padding:30px;
      border-radius:20px;
      background: rgba(0,0,0,0.6);
      text-align:center;
    }

    .login-box input {
      width:100%;
      padding:12px;
      border-radius:10px;
      border:none;
      background:white;
      color:black;
    }

    .login-box button {
      margin-top:15px;
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#0072ff;
      color:white;
      cursor:pointer;
    }

    .container {
      display:none;
      width:400px;
      margin:auto;
      margin-top:80px;
      text-align:center;
    }

    #dropArea {
      border:2px dashed white;
      padding:20px;
      cursor:pointer;
    }

    .footer {
      position:fixed;
      bottom:10px;
      right:10px;
      color:#ccc;
    }
  </style>
</head>

<body>

<div class="login-overlay" id="loginBox">
  <div class="login-box">
    <h3>Login</h3>
    <input type="password" id="password" placeholder="Enter Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<div class="container" id="app">
  <h2>ZIP Processor</h2>

  <div id="dropArea" onclick="document.getElementById('files').click()">
    Drag & Drop ZIP Files<br><br>
    Click to Select
    <input type="file" id="files" multiple style="display:none;">
  </div>

  <button onclick="upload()">Upload</button>
  <button onclick="download()">Download</button>
</div>

<div class="footer">@Innovatiview India Ltd.</div>

<script>
let selectedFiles = [];

function login() {
  if (document.getElementById("password").value === "admin123") {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("app").style.display = "block";
  } else {
    alert("Wrong Password");
  }
}

document.getElementById("files").addEventListener("change", function(e){
  selectedFiles = Array.from(e.target.files);
});

function upload() {
  if (selectedFiles.length === 0) {
    alert("Select files first");
    return;
  }

  let formData = new FormData();
  selectedFiles.forEach(f => formData.append("files", f));

  fetch("/upload", {
    method: "POST",
    body: formData
  });

  alert("Processing started...");
}

function download() {
  window.open("/download");
}
</script>

</body>
</html>

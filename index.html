<!DOCTYPE html>
<html>
<head>
  <title>ZIP Processor</title>

  <style>
    body {
      margin:0;
      font-family: 'Segoe UI';
      background: linear-gradient(135deg,#141e30,#243b55);
      color:white;
    }

    .container {
      width:420px;
      margin:auto;
      margin-top:80px;
      padding:25px;
      border-radius:20px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      text-align:center;
    }

    h2 {
      margin-bottom:15px;
    }

    #dropArea {
      border:2px dashed rgba(255,255,255,0.4);
      padding:25px;
      border-radius:12px;
      cursor:pointer;
    }

    button {
      margin-top:10px;
      padding:12px;
      width:100%;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
    }

    .upload { background: linear-gradient(135deg,#00c6ff,#0072ff); color:white; }
    .download { background: linear-gradient(135deg,#f7971e,#ffd200); }

    .bar {
      width:100%;
      background: rgba(255,255,255,0.2);
      border-radius:10px;
      margin-top:12px;
    }

    .progress {
      height:10px;
      width:0%;
      background: lime;
    }

    .file-list {
      margin-top:10px;
      max-height:80px;
      overflow:auto;
      font-size:13px;
      text-align:left;
    }

    .file-item {
      display:flex;
      justify-content:space-between;
      margin-bottom:5px;
      background: rgba(255,255,255,0.1);
      padding:5px;
      border-radius:6px;
    }

    .footer {
      position:fixed;
      bottom:10px;
      right:15px;
      font-size:12px;
      color:#ffffff88;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>🚀 ZIP Processor</h2>

  <div id="dropArea">
    📂 Drag & Drop ZIP Files<br><br>
    <small>or Click to Select</small>
    <input type="file" id="files" multiple style="display:none;" onchange="handleFiles(this.files)">
  </div>

  <div class="file-list" id="fileList"></div>

  <button class="upload" onclick="upload()">⬆ Upload & Process</button>

  <div class="bar">
    <div class="progress" id="bar"></div>
  </div>

  <button class="download" onclick="download()">📥 Download ZIP</button>
</div>

<div class="footer">@Innovatiview India Ltd.</div>

<script>
let selectedFiles = [];
let dropArea = document.getElementById("dropArea");

dropArea.onclick = () => document.getElementById("files").click();

dropArea.addEventListener("dragover", e => {
  e.preventDefault();
});

dropArea.addEventListener("drop", e => {
  e.preventDefault();
  handleFiles(e.dataTransfer.files);
});

// HANDLE FILES
function handleFiles(files) {
  selectedFiles = Array.from(files);

  let html = "";
  selectedFiles.forEach((f, i) => {
    html += `<div class="file-item">
      ${f.name}
      <span onclick="removeFile(${i})">❌</span>
    </div>`;
  });

  document.getElementById("fileList").innerHTML = html;
}

// REMOVE FILE
function removeFile(index) {
  selectedFiles.splice(index, 1);
  handleFiles(selectedFiles);
}

// UPLOAD
async function upload() {
  if (selectedFiles.length === 0) {
    alert("No files selected");
    return;
  }

  let formData = new FormData();
  selectedFiles.forEach(f => formData.append("files", f));

  fetch("/upload", {
    method: "POST",
    body: formData
  });

  track();
}

// PROGRESS
function track() {
  let interval = setInterval(async () => {
    let res = await fetch("/progress");
    let data = await res.json();

    document.getElementById("bar").style.width = data.progress + "%";

    if (data.progress >= 100) clearInterval(interval);
  }, 500);
}

// DOWNLOAD
function download() {
  window.open("/download");
}
</script>

</body>
</html>

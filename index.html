<!DOCTYPE html>
<html>
<head>
  <title>ZIP Processor</title>
  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg,#1e3c72,#2a5298);
      color:white;
      text-align:center;
      margin:0;
    }

    .container {
      width:400px;
      margin:80px auto;
      padding:20px;
      background:rgba(255,255,255,0.1);
      border-radius:15px;
      backdrop-filter: blur(10px);
    }

    #dropArea {
      border:2px dashed white;
      padding:20px;
      border-radius:10px;
      cursor:pointer;
      margin-top:10px;
    }

    button {
      margin-top:10px;
      padding:10px;
      width:100%;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    .progress {
      width:0%;
      height:10px;
      background:lime;
      margin-top:10px;
    }

    .bar {
      width:100%;
      background:#ccc;
    }

    .footer {
      position:fixed;
      bottom:10px;
      right:10px;
      font-size:12px;
      color:#ffffffaa;
    }

    .login {
      position:fixed;
      width:100%;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      backdrop-filter:blur(10px);
    }

    .login-box {
      background:rgba(255,255,255,0.1);
      padding:20px;
      border-radius:10px;
    }
  </style>
</head>

<body>

<div class="login" id="login">
  <div class="login-box">
    <h3>Login</h3>
    <input type="password" id="pass" placeholder="Password">
    <br><br>
    <button onclick="login()">Login</button>
  </div>
</div>

<div class="container" id="app" style="display:none;">
  <h2>ZIP Processor</h2>

  <div id="dropArea">
    Drag & Drop ZIP Files<br>or Click
    <input type="file" id="files" multiple style="display:none;">
  </div>

  <button onclick="upload()">Upload & Process</button>

  <div class="bar">
    <div class="progress" id="bar"></div>
  </div>

  <button onclick="download()">Download ZIP</button>
</div>

<div class="footer">@Innovatiview India Ltd.</div>

<script>
let dropArea = document.getElementById("dropArea");

dropArea.onclick = () => document.getElementById("files").click();

dropArea.addEventListener("dragover", e => {
  e.preventDefault();
});

dropArea.addEventListener("drop", e => {
  e.preventDefault();
  document.getElementById("files").files = e.dataTransfer.files;
});

// LOGIN
function login() {
  if (document.getElementById("pass").value === "admin123") {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
  } else {
    alert("Wrong Password");
  }
}

// UPLOAD
async function upload() {
  let files = document.getElementById("files").files;
  let formData = new FormData();

  for (let f of files) formData.append("files", f);

  fetch("/upload", {
    method: "POST",
    body: formData
  });

  track();
}

// PROGRESS TRACK
function track() {
  let interval = setInterval(async () => {
    let res = await fetch("/progress");
    let data = await res.json();

    document.getElementById("bar").style.width = data.progress + "%";

    if (data.progress >= 100) clearInterval(interval);
  }, 500);
}

// DOWNLOAD
function download() {
  window.open("/download");
}
</script>

</body>
</html>
